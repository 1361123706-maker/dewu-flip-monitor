name: 快进快出监控

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: write

jobs:
  monitor:

    runs-on: ubuntu-latest

    steps:

      - name: 拉取仓库代码
        uses: actions/checkout@v6

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: 安装浏览器采集环境
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: 测试自建数据接口
        run: |
          python collector_api.py &
          SERVER_PID=$!
          sleep 2

          python - <<'PY'
          import json
          import urllib.request

          url = "http://127.0.0.1:8080/health"

          with urllib.request.urlopen(url, timeout=10) as response:
              data = json.loads(response.read().decode("utf-8"))

          print("自建数据接口返回：", data)

          if data.get("status") != "ok":
              raise SystemExit("自建数据接口测试失败")

          print("自建数据接口测试成功")
          PY

          kill $SERVER_PID || true

      - name: 自动公开商品浏览采集
        run: |
          python product_search_collector.py

      - name: 检查发现层
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("discovery_data.json")

          if not path.exists():
              raise SystemExit("discovery_data.json 不存在")

          data = json.loads(path.read_text(encoding="utf-8"))
          products = data.get("products", [])

          print("发现层商品数量：", len(products))

          named = 0
          priced = 0
          linked = 0
          sku_priced = 0

          for item in products:
              if not isinstance(item, dict):
                  continue

              if item.get("name"):
                  named += 1

              buy_price = item.get("buy_price")

              try:
                  buy_price_valid = float(buy_price) > 0
              except Exception:
                  buy_price_valid = False

              size_prices = item.get("size_price_map")
              size_price_valid = False

              if isinstance(size_prices, dict):
                  for value in size_prices.values():
                      try:
                          if float(value) > 0:
                              size_price_valid = True
                              break
                      except Exception:
                          continue

              if buy_price_valid or size_price_valid:
                  priced += 1

              if size_price_valid:
                  sku_priced += 1

              if item.get("shihuo_url"):
                  linked += 1

          print("有商品名称：", named)
          print("有有效买入价格证据：", priced)
          print("有尺码价格表：", sku_priced)
          print("有识货链接：", linked)

          if len(products) == 0:
              raise SystemExit("本次没有发现任何商品")

          if named == 0:
              raise SystemExit("发现层没有有效商品名称")

          if priced == 0:
              raise SystemExit("发现层没有有效买入价格证据")

          if linked == 0:
              raise SystemExit("发现层没有有效商品链接")
          PY

      - name: 采集市场数据
        run: |
          python market_data_collector.py

      - name: 运行市场数据桥接
        run: |
          python market_data_bridge.py

      - name: 检查最终商品数据
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("products.json")

          if not path.exists():
              raise SystemExit("products.json 不存在")

          data = json.loads(path.read_text(encoding="utf-8"))
          products = data.get("products", [])

          print("最终商品数量：", len(products))

          valid_names = 0
          valid_prices = 0
          valid_sku_maps = 0
          valid_dewu_prices = 0

          for item in products:
              if not isinstance(item, dict):
                  continue

              name = item.get("name")

              if name and name != "未知商品":
                  valid_names += 1

              buy_price = item.get("buy_price")
              buy_price_valid = False

              try:
                  buy_price_valid = float(buy_price) > 0
              except Exception:
                  pass

              size_prices = item.get("size_price_map")
              size_price_valid = False

              if isinstance(size_prices, dict):
                  for value in size_prices.values():
                      try:
                          if float(value) > 0:
                              size_price_valid = True
                              break
                      except Exception:
                          continue

              if buy_price_valid or size_price_valid:
                  valid_prices += 1

              if size_price_valid:
                  valid_sku_maps += 1

              dewu_price = item.get("dewu_channel_price")

              try:
                  if float(dewu_price) > 0:
                      valid_dewu_prices += 1
              except Exception:
                  pass

          print("有效商品名称：", valid_names)
          print("有效买入价格：", valid_prices)
          print("有尺码价格表：", valid_sku_maps)
          print("有得物渠道售价：", valid_dewu_prices)

          if len(products) == 0:
              raise SystemExit("最终商品数据为空")

          if valid_names == 0:
              raise SystemExit("最终商品没有有效名称")

          if valid_prices == 0:
              raise SystemExit("最终商品没有有效买入价格")
          PY

      - name: 运行风控监控
        run: |
          python monitor.py

      - name: 检查监控结果
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("monitor_results.json")

          if not path.exists():
              raise SystemExit("monitor_results.json 不存在")

          data = json.loads(path.read_text(encoding="utf-8"))

          print("监控商品：", data.get("monitored_count"))
          print("候选机会：", data.get("candidate_count"))
          print("A级：", data.get("grade_a_count"))
          print("B级：", data.get("grade_b_count"))
          print("C级：", data.get("grade_c_count"))
          print("D级：", data.get("grade_d_count"))
          print("本次运行完成。")
          PY

      - name: 微信通知新盈利机会
        if: ${{ secrets.PUSHPLUS_TOKEN != '' }}
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          python notifier.py

      - name: 保存最新数据和监控结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            discovery_data.json \
            products.json \
            monitor_results.json \
            notification_state.json

          git diff --cached --quiet \
            || git commit \
              -m "更新商品发现、监控和通知状态"

          git push
