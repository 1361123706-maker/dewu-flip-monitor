<style>
:root{--bg:#f3f5f8;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--dark:#0f172a;--green:#047857;--green-bg:#ecfdf5;--blue:#1d4ed8;--blue-bg:#eff6ff;--orange:#b45309;--orange-bg:#fff7ed;--red:#b91c1c;--red-bg:#fef2f2;--shadow:0 8px 28px rgba(15,23,42,.07)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit}
.top{background:linear-gradient(145deg,#0b1220,#172033);color:#fff;padding:calc(20px + env(safe-area-inset-top)) 18px 22px;position:sticky;top:0;z-index:20}.top-inner{max-width:900px;margin:auto}.title-row{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:25px;line-height:1.2;margin:0;font-weight:800;letter-spacing:-.5px}.subtitle{margin-top:7px;color:#cbd5e1;font-size:13px}.refresh{background:#fff;color:#0f172a;border:0;border-radius:13px;padding:10px 13px;font-weight:700;min-width:68px}.refresh:active{transform:scale(.97)}
main{max-width:900px;margin:auto;padding:14px 14px calc(34px + env(safe-area-inset-bottom))}.card{background:var(--card);border-radius:22px;padding:17px;margin:12px 0;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.7)}.status-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.status-dot{display:inline-flex;align-items:center;gap:7px;background:var(--green-bg);color:var(--green);padding:7px 11px;border-radius:999px;font-size:13px;font-weight:700}.dot{width:8px;height:8px;background:#34d399;border-radius:50%;display:inline-block}.updated{margin-top:7px;color:var(--muted);font-size:12px}.section-title{font-size:19px;font-weight:800;margin:0}.section-sub{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.55}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:13px}.metric{background:#f8fafc;border-radius:15px;padding:12px}.metric-label{font-size:11px;color:var(--muted)}.metric-value{font-size:20px;font-weight:800;margin-top:4px;letter-spacing:-.2px}.metric-value.green{color:var(--green)}.metric-value.blue{color:var(--blue)}.metric-value.red{color:var(--red)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;margin-top:12px}.chips::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:#4b5563;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:700}.chip.active{background:var(--dark);color:#fff;border-color:var(--dark)}.opportunity{border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:10px;background:#fff}.item-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.item-name{font-size:15px;line-height:1.45;font-weight:800}.grade{flex:0 0 auto;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:800}.grade-a{background:var(--green-bg);color:var(--green)}.grade-b{background:var(--blue-bg);color:var(--blue)}.grade-c{background:var(--orange-bg);color:var(--orange)}.grade-d{background:var(--red-bg);color:var(--red)}.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.pill{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:700}.pill.ok{background:var(--green-bg);color:var(--green)}.pill.warn{background:var(--orange-bg);color:var(--orange)}.pill.bad{background:var(--red-bg);color:var(--red)}.pill.gray{background:#f1f5f9;color:#64748b}
.profit-box{margin-top:12px;padding:12px;border-radius:15px;background:#f8fafc;display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.profit-main{background:var(--green-bg);border-radius:14px;padding:11px}.profit-main small{color:var(--green);font-size:11px}.profit-main b{display:block;color:var(--green);font-size:23px;margin-top:3px}.profit-rate{background:var(--blue-bg);border-radius:14px;padding:11px}.profit-rate small{color:var(--blue);font-size:11px}.profit-rate b{display:block;color:var(--blue);font-size:23px;margin-top:3px}.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:10px}.detail{background:#f8fafc;border-radius:11px;padding:9px;min-width:0}.detail small{display:block;color:var(--muted);font-size:10px}.detail b{display:block;font-size:12px;margin-top:3px;word-break:break-word}.actions{display:flex;gap:8px;margin-top:12px}.action{flex:1;text-align:center;text-decoration:none;border-radius:12px;padding:10px;background:var(--dark);color:#fff;font-size:12px;font-weight:800}.action.secondary{background:#eef2f7;color:#334155}.action.disabled{opacity:.45;pointer-events:none}.empty{text-align:center;padding:24px 12px;background:#f8fafc;border-radius:16px;margin-top:12px}.empty-icon{font-size:28px}.empty-title{font-weight:800;margin-top:7px}.empty-text{font-size:12px;color:var(--muted);line-height:1.6;margin-top:5px}.rule-list{font-size:12px;line-height:1.8;color:#4b5563;margin-top:9px}.rule-list b{color:#111827}.data-note{font-size:12px;color:var(--muted);line-height:1.7}.error{background:var(--red-bg);color:var(--red);padding:12px;border-radius:14px;font-size:12px;line-height:1.6}.loading{opacity:.65}.footer{text-align:center;color:#94a3b8;font-size:11px;padding:12px}.notice{margin-top:10px;padding:10px;border-radius:12px;background:#f8fafc}.small{font-size:11px;line-height:1.55}.source{margin-top:7px;font-size:11px;color:var(--muted);line-height:1.5}.source a{color:#1d4ed8;text-decoration:none}
@media(min-width:650px){.metrics{grid-template-columns:repeat(4,1fr)}.detail-grid{grid-template-columns:repeat(4,1fr)}}

.modal-backdrop{position:fixed;inset:0;background:rgba(2,6,23,.58);z-index:100;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(5px)}
.modal-backdrop.show{display:flex}.modal{width:100%;max-width:900px;max-height:88vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px rgba(0,0,0,.2)}
.modal-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.modal-title{font-size:20px;font-weight:850;line-height:1.35}.close{border:0;background:#eef2f7;color:#334155;width:40px;height:40px;border-radius:50%;font-size:22px;font-weight:700}
.detail-section{margin-top:14px;padding-top:14px;border-top:1px solid #edf0f3}.detail-section-title{font-size:14px;font-weight:800;margin-bottom:9px}.detail-lines{font-size:12px;line-height:1.8;color:#475569}.detail-lines b{color:#111827}
.link-list{display:flex;flex-direction:column;gap:7px}.link-item{display:block;text-decoration:none;background:#f8fafc;border-radius:12px;padding:10px;color:#1d4ed8;font-size:12px;font-weight:700;word-break:break-all}
.risk-list{margin:0;padding-left:18px;color:#b91c1c;font-size:12px;line-height:1.7}.modal-actions{display:flex;gap:8px;margin-top:14px}.modal-actions a{flex:1;text-align:center;text-decoration:none;border-radius:13px;padding:12px;background:#0f172a;color:#fff;font-size:12px;font-weight:800}.modal-actions a.secondary{background:#eef2f7;color:#334155}
@media(min-width:650px){.modal-backdrop{align-items:center;padding:20px}.modal{border-radius:24px;max-height:85vh}}

</style>
</head>
<body>
<header class="top"><div class="top-inner"><div class="title-row"><div><h1>得物套利监控</h1><div class="subtitle">自动采集 · 活动优惠 · 到手价 · 利润 · 风控</div></div><button class="refresh" id="refreshBtn" onclick="loadData(true)">刷新</button></div></div></header>
<main>
<section class="card"><div class="status-row"><div><div class="status-dot"><span class="dot"></span><span id="systemStatus">正在读取</span></div><div class="updated" id="updated">等待后台数据……</div></div></div></section>
<section class="card"><div class="section-title">本金设置卡片<a class="action" href="https://github.com/1361123706-maker/dewu-flip-monitor/edit/main/config.json" target="_blank" rel="noopener">⚙️ 点击修改本金</a>
本轮监控</div><div class="section-sub">只把真正满足核心利润与风险条件的商品送入推荐区。</div><div class="metrics">
<div class="metric"><div class="metric-label">扫描商品</div><div class="metric-value" id="count">—</div></div>
<div class="metric"><div class="metric-label">A/B候选</div><div class="metric-value green" id="candidateCount">—</div></div>
<div class="metric"><div class="metric-label">A级</div><div class="metric-value green" id="aCount">—</div></div>
<div class="metric"><div class="metric-label">B级</div><div class="metric-value blue" id="bCount">—</div></div>
<div class="metric"><div class="metric-label">C级</div><div class="metric-value" id="cCount">—</div></div>
<div class="metric"><div class="metric-label">D级</div><div class="metric-value red" id="dCount">—</div></div>
<div class="metric"><div class="metric-label">估算利润商品</div><div class="metric-value" id="profitCount">—</div></div>
<div class="metric"><div class="metric-label">最大本金</div><div class="metric-value" id="capital">—</div></div>
</div></section>
<section class="card"><div class="section-title">机会中心</div><div class="section-sub">A/B 为当前通过核心筛选的候选。无候选时不会为了“看起来有价差”而提醒。<br>点击商品卡片可查看完整套利详情。</div><div class="chips"><button class="chip active" data-filter="candidate">A/B机会</button><button class="chip" data-filter="A">A级</button><button class="chip" data-filter="B">B级</button><button class="chip" data-filter="coupon">有优惠</button><button class="chip" data-filter="all">全部结果</button></div><div id="opportunityList"><div class="empty loading">正在读取后台最新结果……</div></div></section>
<section class="card"><div class="section-title">当前风控规则</div><div class="rule-list" id="rules">正在读取……</div></section>
<section class="card"><div class="section-title">数据状态</div><div class="data-note" id="dataStatus">正在检查……</div></section>
<div class="footer">后台每次运行后更新 monitor_results.json · 页面每 60 秒自动刷新</div>
</main>
<script>
let latestData=null,currentFilter="candidate";const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function num(v){const n=Number(v);return Number.isFinite(n)?n.toLocaleString("zh-CN"):"未确认"}
function money(v){const n=Number(v);return Number.isFinite(n)?"¥"+n.toFixed(2):"未确认"}
function pct(v){const n=Number(v);return Number.isFinite(n)?n.toFixed(1)+"%":"未确认"}
function timeText(v){if(!v)return"时间未确认";const d=new Date(v);if(Number.isNaN(d.getTime()))return esc(v);return d.toLocaleString("zh-CN",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"})}
function ageText(v){if(!v)return"";const d=new Date(v);if(Number.isNaN(d.getTime()))return"";const sec=Math.max(0,Math.floor((Date.now()-d.getTime())/1000));if(sec<60)return"刚刚更新";if(sec<3600)return Math.floor(sec/60)+" 分钟前更新";if(sec<86400)return Math.floor(sec/3600)+" 小时前更新";return Math.floor(sec/86400)+" 天前更新"}
function gradeClass(g){g=String(g||"").toUpperCase();return g==="A"?"grade-a":g==="B"?"grade-b":g==="C"?"grade-c":"grade-d"}
function gradeText(g){g=String(g||"").toUpperCase();return g?g+"级":"未知"}
function hasCoupon(x){return(Array.isArray(x.coupon_urls)&&x.coupon_urls.length>0)||(Array.isArray(x.promotion_offers)&&x.promotion_offers.length>0)||!!x.best_effective_buy_price||!!x.promotion_discount_total}
function profitValue(x){const n=Number(x.estimated_profit??x.profit);return Number.isFinite(n)?n:-Infinity}
function filteredItems(){if(!latestData)return[];const all=Array.isArray(latestData.results)?latestData.results:[];if(currentFilter==="all")return all;if(currentFilter==="coupon")return all.filter(hasCoupon);if(currentFilter==="A")return all.filter(x=>String(x.grade).toUpperCase()==="A");if(currentFilter==="B")return all.filter(x=>String(x.grade).toUpperCase()==="B");return Array.isArray(latestData.candidates)?latestData.candidates:all.filter(x=>["A","B"].includes(String(x.grade).toUpperCase()))}
function renderItem(x){const grade=String(x.grade||"").toUpperCase(),profit=x.estimated_profit??x.profit,buy=x.buy_price??x.sku_buy_price,income=x.expected_income??x.estimated_income,size=x.sku_size,risks=Array.isArray(x.hard_risks)?x.hard_risks:[],coupons=Array.isArray(x.coupon_urls)?x.coupon_urls:[],buyUrl=x.buy_url||"",dewuUrl=x.dewu_url||x.dewu_link||"",source=x.buy_platform||x.data_source||x.source_note||"识货/多平台采集",sales=x.sales_7d??x.sales_30d,salesLabel=x.sales_7d!=null?"近7日销量":"近30日销量";const couponHtml=hasCoupon(x)?'<span class="pill ok">🎟️ 有优惠信息</span>':'<span class="pill gray">暂无优惠证据</span>';const riskHtml=risks.length?'<span class="pill bad">⚠️ '+esc(risks[0])+'</span>':'<span class="pill ok">🟢 核心风险通过</span>';const couponLinks=coupons.length?'<div class="source">优惠入口：'+coupons.slice(0,3).map((u,i)=>'<a href="'+esc(u)+'" target="_blank" rel="noopener">领取优惠'+(i+1)+'</a>').join(" · ")+'</div>':'';return '<article class="opportunity"><div class="item-head"><div class="item-name">'+esc(x.name||"未命名商品")+'</div><div class="grade '+gradeClass(grade)+'">'+gradeText(grade)+'</div></div><div class="meta">'+(size?'<span class="pill gray">尺码 '+esc(size)+'</span>':"")+(x.color?'<span class="pill gray">'+esc(x.color)+'</span>':"")+couponHtml+riskHtml+'</div><div class="profit-box"><div class="profit-main"><small>预计净利润</small><b>'+money(profit)+'</b></div><div class="profit-rate"><small>利润率</small><b>'+pct(x.profit_rate)+'</b></div></div><div class="detail-grid"><div class="detail"><small>最终买入价</small><b>'+money(buy)+'</b></div><div class="detail"><small>得物售价</small><b>'+money(x.dewu_price)+'</b></div><div class="detail"><small>预计到账</small><b>'+money(income)+'</b></div><div class="detail"><small>资金占用</small><b>'+money(x.total_cost)+'</b></div><div class="detail"><small>7日最低</small><b>'+money(x.price_7d_low)+'</b></div><div class="detail"><small>7日最高</small><b>'+money(x.price_7d_high)+'</b></div><div class="detail"><small>下跌风险</small><b>'+money(x.downside_loss)+'</b></div><div class="detail"><small>'+salesLabel+'</small><b>'+(sales==null?"未确认":num(sales))+'</b></div></div><div class="notice"><div class="small"><b>优惠状态：</b>'+esc(x.promotion_status||"无已应用优惠")+'</div><div class="small" style="margin-top:4px"><b>买入来源：</b>'+esc(source)+'</div>'+(x.turnover_evidence?'<div class="small" style="margin-top:4px"><b>周转：</b>'+esc(x.turnover_evidence)+'</div>':"")+(x.price_trend?'<div class="small" style="margin-top:4px"><b>价格趋势：</b>'+esc(x.price_trend)+'</div>':"")+couponLinks+'</div><div class="actions"><a class="action '+(buyUrl?"":"disabled")+'" href="'+esc(buyUrl||"#")+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">去购买</a><a class="action secondary '+(dewuUrl?"":"disabled")+'" href="'+esc(dewuUrl||"#")+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">看得物</a></div></article>'}
function renderList(){
  const list = $("opportunityList");
  let items = filteredItems().slice();
  items.sort((a,b) => profitValue(b) - profitValue(a));
  visibleItems = items.slice(0,50).map((item,index)=>{ item.__viewIndex=index; return item; });

  if(currentFilter==="candidate" && visibleItems.length===0){
    list.innerHTML='<div class="empty"><div class="empty-icon">🟢</div><div class="empty-title">当前没有 A/B 级推荐机会</div><div class="empty-text">本轮 '+num(latestData?.monitored_count)+' 个商品中，没有同时满足最低利润、利润率、资金和核心风控条件的商品。系统不会为了凑数量而提醒。</div></div>'; return;
  }
  if(visibleItems.length===0){
    list.innerHTML='<div class="empty"><div class="empty-icon">🔎</div><div class="empty-title">这个筛选条件暂时没有结果</div><div class="empty-text">可以切换到“全部结果”查看后台本轮扫描情况。</div></div>'; return;
  }
  list.innerHTML=visibleItems.map(renderItem).join("");
}

function render(data){latestData=data;const rules=data.rules||{};$("systemStatus").textContent="后台数据正常";$("updated").textContent="最后更新："+timeText(data.updated_at)+" · "+ageText(data.updated_at);$("count").textContent=num(data.monitored_count??data.summary?.total);$("candidateCount").textContent=num(data.candidate_count);$("aCount").textContent=num(data.grade_a_count??data.summary?.A);$("bCount").textContent=num(data.grade_b_count??data.summary?.B);$("cCount").textContent=num(data.grade_c_count??data.summary?.C);$("dCount").textContent=num(data.grade_d_count??data.summary?.D);$("profitCount").textContent=num(data.summary?.estimated_profit_count);$("capital").textContent=money(data.capital);$("rules").innerHTML='<div><b>本金：</b>'+money(data.capital)+'</div><div><b>最低净利润：</b>'+money(rules.min_profit??data.min_profit)+' · <b>最低利润率：</b>'+pct(rules.min_profit_rate??data.min_profit_rate)+'</div><div><b>最大允许下跌风险：</b>'+money(rules.max_downside_loss??data.max_downside_loss)+' · <b>最长周转：</b>'+esc(rules.max_days??data.max_days??"—")+' 天</div><div><b>得物净收入系数：</b>'+esc(rules.dewu_net_rate??"—")+' · <b>买入运费：</b>'+money(rules.default_buy_shipping??data.default_buy_shipping)+'</div><div><b>SKU级计算：</b>'+(rules.sku_level?"已启用":"未启用")+' · <b>优惠感知：</b>'+(rules.coupon_aware?"已启用":"未启用")+' · <b>多平台买入：</b>'+(rules.multi_platform_buy_sources?"已启用":"未启用")+'</div>';$("dataStatus").innerHTML='<div><span class="pill ok">正常</span></div><div style="margin-top:7px">后台已生成 <b>monitor_results.json</b>，页面通过无缓存请求读取最新版本。自动每 60 秒检查一次；手动点击“刷新”也会立即重新读取。</div><div style="margin-top:7px">当前利润为估算值，公式与实际平台结算费用以后台规则和最终下单页面为准。优惠券、尺码、库存和得物查验条件仍建议下单前再次确认。</div>';renderList()}

function detailRow(label,value){return `<div><b>${esc(label)}：</b>${esc(value ?? "未确认")}</div>`}

function openDetailByIndex(index){
  const item=visibleItems[index]; if(!item)return;
  const grade=String(item.grade||"").toUpperCase();
  const profit=item.estimated_profit??item.profit;
  const buy=item.buy_price??item.sku_buy_price;
  const offers=Array.isArray(item.promotion_offers)?item.promotion_offers:[];
  const coupons=[...(Array.isArray(item.coupon_urls)?item.coupon_urls:[]),...(Array.isArray(item.all_coupon_urls)?item.all_coupon_urls:[])];
  const risks=Array.isArray(item.hard_risks)?item.hard_risks:[];
  const calc=item.promotion_calculation||{};
  const buyUrl=item.buy_url||"", dewuUrl=item.dewu_url||item.dewu_link||"";

  $("modalTitle").textContent=item.name||"商品详情";
  $("modalMeta").innerHTML=`<span class="grade ${gradeClass(grade)}">${gradeText(grade)}</span>`+
    (item.sku_size?`<span class="pill gray">尺码 ${esc(item.sku_size)}</span>`:"")+
    (item.color?`<span class="pill gray">${esc(item.color)}</span>`:"")+
    (hasCoupon(item)?`<span class="pill ok">🎟️ 有优惠信息</span>`:"");

  const riskHtml=risks.length?`<ul class="risk-list">${risks.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:`<div class="pill ok">🟢 当前结果未触发硬风险</div>`;
  const offerHtml=offers.length?offers.map((x,i)=>{
    const label=x.name||x.title||x.description||("优惠 "+(i+1));
    const amount=x.amount!=null?" · 减 "+money(x.amount):"";
    const threshold=x.threshold!=null?" · 满 "+money(x.threshold):"";
    return `<div>${esc(label)}${esc(threshold)}${esc(amount)}</div>`;
  }).join(""):"<div>暂无已应用优惠明细</div>";
  const links=[...new Set(coupons)].filter(Boolean).slice(0,8).map((u,i)=>`<a class="link-item" href="${esc(u)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">🎟️ 优惠入口 ${i+1}</a>`).join("");

  $("modalBody").innerHTML=`
    <div class="profit-box"><div class="profit-main"><small>预计净利润</small><b>${money(profit)}</b></div><div class="profit-rate"><small>利润率</small><b>${pct(item.profit_rate)}</b></div></div>
    <div class="detail-section"><div class="detail-section-title">💰 价格与利润</div><div class="detail-lines">
      ${detailRow("最终买入价",money(buy))}${detailRow("基础买入价",money(item.buy_price_before_discount))}${detailRow("最佳优惠到手价",money(item.best_effective_buy_price))}
      ${detailRow("得物售价",money(item.dewu_price))}${detailRow("预计到账",money(item.expected_income??item.estimated_income))}${detailRow("买入运费",money(item.buy_shipping_cost))}
      ${detailRow("总成本",money(item.total_cost))}${detailRow("利润状态",item.profit_status)}${detailRow("利润公式",latestData?.rules?.profit_formula||"得物售价×92%-买入价-6元")}
    </div></div>
    <div class="detail-section"><div class="detail-section-title">🎟️ 活动与优惠</div><div class="detail-lines">
      ${detailRow("优惠状态",item.promotion_status)}${detailRow("优惠是否验证",item.promotion_verified?"是":"否")}${detailRow("优惠合计",money(item.promotion_discount_total??item.discount_total))}
      ${detailRow("计算基础价",money(calc.base_price))}${detailRow("计算状态",calc.calculation_status)}
    </div><div class="detail-lines" style="margin-top:8px">${offerHtml}</div>${links?`<div class="link-list" style="margin-top:9px">${links}</div>`:""}</div>
    <div class="detail-section"><div class="detail-section-title">📈 价格、销量与周转</div><div class="detail-lines">
      ${detailRow("当前价格",money(item.price_current))}${detailRow("7日最低",money(item.price_7d_low))}${detailRow("7日最高",money(item.price_7d_high))}
      ${detailRow("价格位置",item.price_position_7d)}${detailRow("下跌风险",money(item.downside_to_7d_low))}${detailRow("价格趋势",item.price_trend)}
      ${detailRow("近7日销量",num(item.sales_7d))}${detailRow("近30日销量",num(item.sales_30d))}${detailRow("周转证据",item.turnover_evidence)}${detailRow("周转置信度",item.turnover_confidence)}
    </div></div>
    <div class="detail-section"><div class="detail-section-title">🛡️ 风控与证据</div>${riskHtml}<div class="detail-lines" style="margin-top:9px">
      ${detailRow("商品等级",gradeText(grade))}${detailRow("资金占用比例",pct(item.capital_ratio))}${detailRow("价格证据",item.price_evidence_status)}
      ${detailRow("SKU信息",item.sku_identity_complete?"完整":"未完全确认")}${detailRow("得物查验兼容",item.dewu_check_compatible==null?"未确认":(item.dewu_check_compatible?"是":"否"))}
      ${detailRow("新品证据",item.new_condition_verified==null?"未确认":(item.new_condition_verified?"是":"否"))}
    </div></div>
    <div class="detail-section"><div class="detail-section-title">🔗 操作入口</div><div class="modal-actions">
      <a class="${buyUrl?"":"secondary"} ${buyUrl?"":"disabled"}" href="${esc(buyUrl||"#")}" target="_blank" rel="noopener">去购买</a>
      <a class="secondary ${dewuUrl?"":"disabled"}" href="${esc(dewuUrl||"#")}" target="_blank" rel="noopener">查看得物</a>
    </div></div>`;
  $("detailModal").classList.add("show"); document.body.style.overflow="hidden";
}
function closeDetail(event){
  if(event && event.target!==$("detailModal"))return;
  $("detailModal").classList.remove("show"); document.body.style.overflow="";
}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDetail()});

async function loadData(manual=false){const btn=$("refreshBtn");if(manual){btn.textContent="读取中";btn.disabled=true}try{const r=await fetch("monitor_results.json?ts="+Date.now(),{cache:"no-store",headers:{"Cache-Control":"no-cache"}});if(!r.ok)throw new Error("HTTP "+r.status);render(await r.json())}catch(e){console.error(e);$("systemStatus").textContent="等待后台数据";$("updated").textContent="暂时无法读取最新 monitor_results.json";$("opportunityList").innerHTML='<div class="error">当前无法读取后台结果。请稍后点击“刷新”。<br>如果后台刚刚运行完成，GitHub Pages 可能还需要一点时间完成部署。</div>';$('dataStatus').innerHTML='<div class="error">数据读取失败：'+esc(e.message||e)+'</div>'}finally{if(manual){btn.textContent="刷新";btn.disabled=false}}}
document.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));b.classList.add("active");currentFilter=b.dataset.filter;renderList()}));loadData();setInterval(loadData,60000);
</script>
</body>
</html>
