<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>得物低买高卖 · 实时监控</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f4f5f7;
  color:#111827;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
  "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}

header{
  background:#111827;
  color:white;
  padding:20px 16px;
}

h1{
  font-size:21px;
  margin:0;
}

.sub{
  font-size:12px;
  opacity:.75;
  margin-top:6px;
}

main{
  max-width:800px;
  margin:auto;
  padding:12px;
}

.card{
  background:white;
  border-radius:16px;
  padding:15px;
  margin:10px 0;
  box-shadow:0 2px 10px #0001;
}

.status{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.status-title{
  font-size:15px;
  font-weight:600;
}

.small{
  font-size:12px;
  line-height:1.6;
}

.muted{
  color:#6b7280;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:10px;
}

.metric{
  background:#f8fafc;
  padding:10px;
  border-radius:10px;
}

.metric small{
  display:block;
  color:#6b7280;
  font-size:11px;
}

.metric b{
  display:block;
  margin-top:4px;
  font-size:15px;
}

.item{
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:13px;
  margin-top:10px;
}

.item-name{
  font-weight:600;
  font-size:15px;
  line-height:1.5;
}

.grade{
  display:inline-block;
  padding:4px 9px;
  border-radius:99px;
  font-size:12px;
  font-weight:700;
  margin-top:7px;
}

.grade-a{
  background:#ecfdf5;
  color:#047857;
}

.grade-b{
  background:#eff6ff;
  color:#1d4ed8;
}

.pill{
  display:inline-block;
  padding:5px 9px;
  border-radius:99px;
  font-size:11px;
}

.ok{
  background:#ecfdf5;
  color:#047857;
}

.warn{
  background:#fffbeb;
  color:#92400e;
}

.bad{
  background:#fef2f2;
  color:#b91c1c;
}

.green{
  color:#047857;
}

.red{
  color:#b91c1c;
}

button{
  border:0;
  border-radius:10px;
  background:#111827;
  color:white;
  padding:9px 12px;
  font-size:13px;
}

button:active{
  opacity:.7;
}

.notice{
  padding:11px;
  background:#f8fafc;
  border-radius:10px;
  margin-top:10px;
}

.reason{
  margin-top:9px;
  color:#b91c1c;
}

.source{
  margin-top:8px;
  color:#6b7280;
  font-size:11px;
}

hr{
  border:0;
  border-top:1px solid #eee;
  margin:12px 0;
}

@media(max-width:520px){
  .grid{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

<body>

<header>
  <h1>得物低买高卖 · 实时监控</h1>

  <div class="sub">
    后台自动采集 · 利润计算 · A/B 风控筛选
  </div>
</header>

<main>

  <!-- 系统状态 -->
  <div class="card">

    <div class="status">

      <div>

        <div class="status-title" id="systemStatus">
          正在读取最新数据……
        </div>

        <div class="small muted" id="updated">
          等待后台数据
        </div>

      </div>

      <button onclick="loadData()">
        刷新
      </button>

    </div>

  </div>


  <!-- 本轮监控 -->
  <div class="card">

    <b>本轮监控</b>

    <div class="grid">

      <div class="metric">
        <small>扫描商品</small>
        <b id="count">—</b>
      </div>

      <div class="metric">
        <small>A/B候选</small>
        <b id="candidateCount">—</b>
      </div>

      <div class="metric">
        <small>最大资金</small>
        <b id="capital">—</b>
      </div>

    </div>

  </div>


  <!-- 推荐候选 -->
  <div class="card">

    <b>推荐候选机会（A/B级）</b>

    <div class="small muted" style="margin-top:6px">
      A、B 都属于可进一步考虑的候选机会；系统会先筛掉明显不适合快进快出的商品。
    </div>

    <div id="opportunityList">

      <div class="notice small muted">
        正在读取后台最新结果……
      </div>

    </div>

  </div>


  <!-- 风控规则 -->
  <div class="card">

    <b>当前风控规则</b>

    <div class="small muted" id="rules">
      正在读取……
    </div>

  </div>


  <!-- 数据说明 -->
  <div class="card">

    <b>数据状态</b>

    <div class="small" id="dataStatus">
      正在检查……
    </div>

  </div>

</main>


<script>

function money(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){
    return "未确认";
  }

  const number = Number(value);

  if(!Number.isFinite(number)){
    return "未确认";
  }

  return "¥" + number.toFixed(2);
}


function percent(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){
    return "未确认";
  }

  const number = Number(value);

  if(!Number.isFinite(number)){
    return "未确认";
  }

  return number.toFixed(1) + "%";
}


function numberText(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){
    return "未确认";
  }

  const number = Number(value);

  if(!Number.isFinite(number)){
    return escapeHtml(value);
  }

  return number.toLocaleString("zh-CN");
}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function formatTime(value){

  if(!value){
    return "时间未确认";
  }

  const date = new Date(value);

  if(isNaN(date.getTime())){
    return String(value);
  }

  return date.toLocaleString(
    "zh-CN",
    {
      year:"numeric",
      month:"2-digit",
      day:"2-digit",
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit"
    }
  );
}


function getGradeClass(grade){

  if(String(grade).toUpperCase() === "A"){
    return "grade-a";
  }

  return "grade-b";
}


function getGradeText(grade){

  const g = String(grade || "").toUpperCase();

  if(g === "A"){
    return "A级 · 推荐候选";
  }

  if(g === "B"){
    return "B级 · 推荐候选";
  }

  return g || "候选";
}


function render(data){

  document.getElementById("systemStatus").innerHTML =
    '<span class="pill ok">● 后台数据正常</span>';

  document.getElementById("updated").textContent =
    "最后更新：" + formatTime(data.updated_at);


  document.getElementById("count").textContent =
    data.monitored_count ?? 0;


  document.getElementById("candidateCount").textContent =
    data.candidate_count ?? 0;


  document.getElementById("capital").textContent =
    money(data.capital);


  /*
   * 推荐候选列表
   */

  const list =
    document.getElementById("opportunityList");


  const candidates =
    Array.isArray(data.candidates)
      ? data.candidates
      : [];


  if(candidates.length === 0){

    list.innerHTML = `

      <div class="notice">

        <div class="pill ok">
          当前没有A/B级推荐候选
        </div>

        <div class="small muted" style="margin-top:8px">

          系统不会因为“看起来有价差”就提醒购买。

          A/B级代表存在实际盈利空间，并通过当前核心风险筛选；

          部分辅助数据仍可能需要你下单前再次确认。

        </div>

      </div>

    `;

  }else{

    list.innerHTML =

      candidates.map(item => {

        const grade =
          String(item.grade || "B").toUpperCase();

        const gradeClass =
          getGradeClass(grade);

        const gradeText =
          getGradeText(grade);


        /*
         * 近日销量
         */

        let salesText = "未确认";

        if(
          item.sales_7d !== null &&
          item.sales_7d !== undefined &&
          item.sales_7d !== ""
        ){

          salesText =
            "近7日 " +
            numberText(item.sales_7d) +
            " 件";

        }else if(
          item.sales_30d !== null &&
          item.sales_30d !== undefined &&
          item.sales_30d !== ""
        ){

          salesText =
            "近30日 " +
            numberText(item.sales_30d) +
            " 件";

        }


        /*
         * 当前价格
         */

        const currentPrice =
          item.trend_current_price ??
          item.price_current ??
          item.dewu_price;


        /*
         * 7日最低
         */

        const low7 =
          item.price_7d_low;


        /*
         * 下跌风险
         */

        let downsideText = "未确认";

        if(
          item.downside_to_7d_low !== null &&
          item.downside_to_7d_low !== undefined
        ){

          downsideText =
            percent(item.downside_to_7d_low);

        }else if(
          item.downside_loss !== null &&
          item.downside_loss !== undefined
        ){

          downsideText =
            money(item.downside_loss);

        }


        /*
         * 价格趋势
         */

        let trendText = "未确认";

        if(item.price_trend){

          trendText =
            String(item.price_trend);

        }else if(item.trend){

          trendText =
            String(item.trend);

        }


        /*
         * 资金占用
         */

        const capitalUsed =
          item.total_buy_cost ??
          item.buy_price;


        return `

          <div class="item">

            <div class="item-name">
              ${escapeHtml(item.name)}
            </div>

            <div class="grade ${gradeClass}">
              ${gradeText}
            </div>

            <hr>

            <div class="grid">

              <div class="metric">
                <small>买入价</small>
                <b>
                  ${money(item.buy_price)}
                </b>
              </div>


              <div class="metric">
                <small>得物售价</small>
                <b>
                  ${money(item.dewu_price)}
                </b>
              </div>


              <div class="metric">
                <small>预计到账</small>
                <b>
                  ${money(item.expected_income)}
                </b>
              </div>


              <div class="metric">
                <small>净利润</small>
                <b class="green">
                  ${money(item.net_profit)}
                </b>
              </div>


              <div class="metric">
                <small>利润率</small>
                <b>
                  ${percent(item.profit_rate)}
                </b>
              </div>


              <div class="metric">
                <small>资金占用</small>
                <b>
                  ${money(capitalUsed)}
                </b>
              </div>


              <div class="metric">
                <small>近日销量</small>
                <b>
                  ${escapeHtml(salesText)}
                </b>
              </div>


              <div class="metric">
                <small>周转证据</small>
                <b>
                  ${escapeHtml(item.days_display || "未确认")}
                </b>
              </div>


              <div class="metric">
                <small>当前价格</small>
                <b>
                  ${money(currentPrice)}
                </b>
              </div>


              <div class="metric">
                <small>7日最低</small>
                <b>
                  ${money(low7)}
                </b>
              </div>


              <div class="metric">
                <small>下跌风险</small>
                <b>
                  ${escapeHtml(downsideText)}
                </b>
              </div>


              <div class="metric">
                <small>价格趋势</small>
                <b>
                  ${escapeHtml(trendText)}
                </b>
              </div>

            </div>


            <div class="notice small">

              <div>
                正品：
                ${item.authenticity_verified === true
                  ? "✓ 已确认"
                  : "✓ 识货来源，正品风险按规则通过"}
              </div>


              <div>
                全新/成色：
                ${item.new_condition_verified === true
                  ? "✓ 已确认"
                  : "⚠ 下单前确认"}
              </div>


              <div>
                得物查验：
                ${item.dewu_check_compatible === true
                  ? "✓ 已确认"
                  : "⚠ 下单前确认"}
              </div>


              <div>
                流动性：
                ${escapeHtml(item.liquidity || "未确认")}
              </div>

            </div>


            ${
              item.turnover_evidence
              ?
              `
              <div class="source">
                周转依据：${escapeHtml(item.turnover_evidence)}
              </div>
              `
              :
              ""
            }


            ${
              item.data_source
              ?
              `
              <div class="source">
                数据来源：${escapeHtml(item.data_source)}
              </div>
              `
              :
              ""
            }


          </div>

        `;

      }).join("");

  }


  /*
   * 风控规则
   */

  document.getElementById("rules").innerHTML = `

    本金：
    ¥${data.capital ?? "—"}

    · 最大资金占用：
    ¥${data.capital ?? "—"}

    · 最长周转：
    ${data.max_days ?? "—"}天

    · 最低净利润：
    ¥${data.min_profit ?? "—"}

    · 最低利润率：
    ${data.min_profit_rate ?? "—"}%

    · 最大允许下跌风险：
    ¥${data.max_downside_loss ?? "—"}

  `;


  /*
   * 数据状态
   */

  document.getElementById("dataStatus").innerHTML = `

    <div>
      <span class="pill ok">正常</span>
    </div>

    <div class="small muted" style="margin-top:8px">

      页面正在读取后台生成的
      <b>monitor_results.json</b>。

      页面每 60 秒自动检查一次最新数据。

    </div>

    <div class="small muted" style="margin-top:8px">

      识货来源的数据按正品承诺处理；

      全新状态、规格、得物查验兼容性以及实际费用，

      仍会在机会筛选和下单前进行确认。

    </div>

  `;

}


async function loadData(){

  try{

    const response =
      await fetch(
        "monitor_results.json?ts=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "HTTP " + response.status
      );

    }


    const data =
      await response.json();


    render(data);


  }catch(error){

    console.log(error);


    document.getElementById(
      "systemStatus"
    ).innerHTML =
      '<span class="pill warn">⚠️ 等待后台更新</span>';


    document.getElementById(
      "updated"
    ).textContent =
      "后台还没有生成最新结果";


    document.getElementById(
      "opportunityList"
    ).innerHTML = `

      <div class="notice">

        <div class="small">
          后台正在运行，暂时还没有新的监控结果。
        </div>

        <div class="small muted" style="margin-top:6px">

          第一次成功运行后，这里会自动显示真实监控结果。

        </div>

      </div>

    `;


    document.getElementById(
      "dataStatus"
    ).innerHTML = `

      <span class="pill warn">
        等待后台数据
      </span>

      <div class="small muted" style="margin-top:8px">

        目前还没有可读取的
        monitor_results.json。

      </div>

    `;

  }

}


/*
 * 第一次打开立即读取
 */

loadData();


/*
 * 每60秒自动刷新
 */

setInterval(
  loadData,
  60000
);

</script>

</body>
</html>
