name: 快进快出监控

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */2 * * *"


jobs:

  monitor:

    runs-on: ubuntu-latest


    steps:

      - name: 拉取仓库代码
        uses: actions/checkout@v6


      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"


      - name: 安装浏览器采集环境
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium


      - name: 测试自建数据接口
        run: |
          python collector_api.py &
          SERVER_PID=$!

          sleep 2

          python - <<'PY'
          import json
          import urllib.request

          url = "http://127.0.0.1:8080/health"

          with urllib.request.urlopen(url, timeout=10) as response:
              data = json.loads(response.read().decode("utf-8"))

          print("自建数据接口返回：", data)

          if data.get("status") != "ok":
              raise SystemExit("自建数据接口测试失败")

          print("自建数据接口测试成功")
          PY

          kill $SERVER_PID || true


      - name: 自动公开商品浏览采集
        run: python product_search_collector.py


      - name: 采集市场数据
        run: python market_data_collector.py


      - name: 运行市场数据桥接
        run: python market_data_bridge.py


      - name: 运行风控监控
        run: python monitor.py
