name: 快进快出监控

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v6

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: 安装浏览器采集环境
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: 测试自建数据接口
        run: |
          python collector_api.py &
          SERVER_PID=$!
          sleep 2
          python - <<'PY'
          import json
          import urllib.request
          url = "http://127.0.0.1:8080/health"
          with urllib.request.urlopen(url, timeout=10) as response:
              data = json.loads(response.read().decode("utf-8"))
          print("自建数据接口返回：", data)
          if data.get("status") != "ok":
              raise SystemExit("自建数据接口测试失败")
          PY
          kill $SERVER_PID || true

      - name: 自动公开商品浏览采集
        run: |
          python product_search_collector.py

      # 新增：修复配色/尺码/SKU身份，并生成精确购买链接。
      - name: 修复 SKU 配色与购买链接
        run: |
          python sku_identity_repair.py

      - name: 检查发现层
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("discovery_data.json")
          if not path.exists():
              raise SystemExit("discovery_data.json 不存在")

          data = json.loads(path.read_text(encoding="utf-8"))
          products = data.get("products", [])

          named = 0
          priced = 0
          linked = 0
          sku_complete = 0

          for item in products:
              if not isinstance(item, dict):
                  continue

              if item.get("name"):
                  named += 1

              try:
                  if float(item.get("buy_price") or 0) > 0:
                      priced += 1
              except Exception:
                  pass

              if item.get("shihuo_url") or item.get("shihuo_sku_url"):
                  linked += 1

              if item.get("sku_identity_complete"):
                  sku_complete += 1

          print("发现层商品数量：", len(products))
          print("有商品名称：", named)
          print("有 SKU 买入价：", priced)
          print("有识货链接：", linked)
          print("SKU身份完整：", sku_complete)

          if not products:
              raise SystemExit("本次没有发现任何商品")
          if named == 0:
              raise SystemExit("发现层没有有效商品名称")
          if linked == 0:
              raise SystemExit("发现层没有有效商品链接")
          PY

      - name: 采集市场数据
        run: |
          python market_data_collector.py

      - name: 运行市场数据桥接
        run: |
          python market_data_bridge.py

      - name: 运行风控监控
        run: |
          python monitor.py

      - name: 检查监控结果
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("monitor_results.json")
          if not path.exists():
              raise SystemExit("monitor_results.json 不存在")

          data = json.loads(path.read_text(encoding="utf-8"))
          print("监控商品：", data.get("monitored_count"))
          print("候选机会：", data.get("candidate_count"))
          print("A级：", data.get("grade_a_count"))
          print("B级：", data.get("grade_b_count"))
          print("C级：", data.get("grade_c_count"))
          print("D级：", data.get("grade_d_count"))
          PY

      - name: 微信通知新盈利机会
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          python notifier.py

      - name: 保存最新数据和监控结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discovery_data.json products.json monitor_results.json notification_state.json
          git diff --cached --quiet || git commit -m "修复SKU身份、配色和监控数据"
          git push