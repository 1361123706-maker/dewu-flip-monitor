<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><title>快进快出监控演示</title>
<style>
body{margin:0;background:#f4f5f7;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#111827;color:#fff;padding:18px 16px}h1{font-size:21px;margin:0}.sub{font-size:12px;opacity:.7;margin-top:5px}
main{max-width:800px;margin:auto;padding:12px}.card{background:#fff;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 10px #0001}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{background:#f8fafc;padding:10px;border-radius:10px}.metric small{display:block;color:#6b7280}.metric b{display:block;margin-top:3px}
input,button{padding:10px;border-radius:10px;border:1px solid #d1d5db;font-size:15px}input{width:100%;box-sizing:border-box}button{background:#111827;color:white;border:0;width:100%;margin-top:8px}
.item{border:1px solid #e5e7eb;border-radius:14px;padding:12px;margin-top:10px}.top{display:flex;justify-content:space-between}.pill{padding:4px 8px;border-radius:99px;font-size:11px}.ok{background:#ecfdf5;color:#047857}.no{background:#fef2f2;color:#b91c1c}.warn{background:#fffbeb;color:#92400e}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}td,th{padding:7px 4px;border-bottom:1px solid #eee;text-align:right}td:first-child,th:first-child{text-align:left}
.green{color:#047857}.red{color:#b91c1c}.muted{color:#6b7280}.small{font-size:12px;line-height:1.55}
</style></head><body>
<header><h1>快进快出 · 手机演示版</h1><div class="sub">模拟多平台比价 + 300元本金风控</div></header>
<main>
<div class="card"><b>资金设置</b><div class="grid" style="margin-top:10px">
<div><small>本金</small><input id="cap" type="number" value="330"></div>
<div><small>单笔上限</small><input id="max" type="number" value="120"></div>
<div><div style="color:#6b7280;font-size:12px">最长周转</div><input id="days" type="number" value="7"></div>
</div><button onclick="render()">重新筛选</button></div>

<div class="card"><b>今日模拟监控结果</b><div class="small muted">以下价格全部是为了展示系统功能而生成的模拟数据，不是真实市场行情，请勿据此购买。</div><div id="list"></div></div>
<div class="card"><b>系统判断逻辑</b><p class="small">系统会先比较多平台买入价，再用得物预估卖出价计算利润；随后检查本金、单笔投入、周转时间、流动性、价格下跌情景、正品/全新状态和查验风险。任何关键条件无法确认，都不会因为“看起来有利润”而直接推荐。</p></div>
</main>
<script>
const items=[
["Nike 小件 A","79","82","85","81","119",2,"高",8,1],
["Adidas 配件 B","108","111","115","109","151",4,"高",13,1],
["潮流配件 C","62","65","61","64","94",3,"中",16,1],
["运动鞋配件 D","119","121","125","118","157",6,"中",18,1],
["冷门收藏 E","88","91","94","89","146",12,"低",35,1],
["商品 F","135","132","139","136","181",5,"高",14,0],
["商品 G","69","72","70","71","101",2,"高",9,1],
["商品 H","112","115","117","113","143",8,"低",27,1]
];
function render(){let cap=+document.getElementById("cap").value,max=+document.getElementById("max").value,days=+document.getElementById("days").value;
let box=document.getElementById("list");box.innerHTML="";
items.forEach(x=>{let buy=Math.min(+x[1],+x[2],+x[3],+x[4]),sell=+x[5],cost=buy+8+6,profit=sell-cost,rate=profit/buy*100,down=+x[8],verified=x[9];
let reasons=[];if(buy>max||buy>cap)reasons.push("资金超限");if(+x[6]>days)reasons.push("周转过长");if(x[7]=="低")reasons.push("流动性低");if(profit<15)reasons.push("净利润不足");if(rate<12)reasons.push("利润率不足");if(down>25)reasons.push("下跌风险高");if(!verified)reasons.push("正品/状态未核验");
let ok=!reasons.length;
let d=document.createElement("div");d.className="item";d.innerHTML=`<div class="top"><b>${x[0]}</b><span class="pill ${ok?'ok':'no'}">${ok?'🟢 候选':'🔴 过滤'}</span></div>
<table><tr><th>平台</th><th>价格</th><th>平台</th><th>价格</th></tr><tr><td>拼多多</td><td>¥${x[1]}</td><td>淘宝</td><td>¥${x[2]}</td></tr><tr><td>京东</td><td>¥${x[3]}</td><td>识货</td><td>¥${x[4]}</td></tr><tr><td>得物</td><td>¥${x[5]}</td><td>最低买入</td><td>¥${buy}</td></tr></table>
<div class="grid" style="margin-top:9px"><div class="metric"><small>预计净利润</small><b class="${profit>=0?'green':'red'}">¥${profit}</b></div><div class="metric"><small>利润率</small><b>${rate.toFixed(1)}%</b></div><div class="metric"><small>周转</small><b>${x[6]} 天</b></div><div class="metric"><small>流动性</small><b>${x[7]}</b></div><div class="metric"><small>下跌情景</small><b class="${down>25?'red':''}">-¥${down}</b></div><div class="metric"><small>资金占用</small><b>¥${buy}/${cap}</b></div></div>
<div class="small ${ok?'green':'red'}" style="margin-top:9px">${ok?'基础规则通过；真实版本仍需实时核验价格、正品、成色、查验与费用。':'过滤原因：'+reasons.join('、')}</div>`;box.appendChild(d)})}
render();
</script></body></html>
